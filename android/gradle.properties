# Heap is deliberately modest. The Flutter template ships -Xmx8G, which on an
# 8 GB machine lets the daemon grow until the whole system swaps. This project
# builds comfortably in 2 GB.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1g

# One build at a time; parallel module builds each spawn their own workers.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
