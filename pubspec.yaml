name: onekit_converter
description: "OneKit - Local File Converter. 5000+ conversion pairs, 100% on-device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing
  provider: ^6.1.2
  go_router: ^14.6.2

  # Files
  file_picker: ^12.1.1
  path_provider: ^2.1.5
  path: ^1.9.0
  share_plus: ^13.0.0
  open_filex: ^4.7.0

  # Persistence
  sqflite: ^2.4.1
  shared_preferences: ^2.3.4

  # Conversion engines
  image: ^4.3.0
  archive: ^4.0.9
  pdf: ^3.11.1
  pdfrx: ^2.4.8
  csv: ^6.0.0
  xml: ^6.5.0
  yaml: ^3.1.2
  markdown: ^7.2.2
  html: ^0.15.5
  crypto: ^3.0.6

  # Monetization
  google_mobile_ads: 9.0.0
  url_launcher: ^6.3.1
  ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
